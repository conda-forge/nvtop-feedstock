{% set version = "3.3.2" %}

package:
  name: nvtop
  version: {{ version }}

source:
  url: https://github.com/Syllo/nvtop/archive/refs/tags/{{ version }}.tar.gz
  sha256: bfcf24a4bbc763c92a630900f1679f05cce3c9d5f4d1f4a95bdb9230ef562665

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - ncurses
    - libdrm  # [linux]
    - libsystemd  # [linux]

test:
  commands:
    - test -f $PREFIX/bin/nvtop
    - nvtop --help

about:
  home: https://github.com/Syllo/nvtop
  summary: Neat Videocard TOP
  description: |
    A (h)top like task monitor for GPUs and accelerators. It can handle
    multiple GPUs and print information about them in a htop-familiar way.
  license: GPL-3.0-only
  license_family: GPL
  license_file: COPYING

extra:
  recipe-maintainers:
    - hmaarrfk
    - matthiasdiener
