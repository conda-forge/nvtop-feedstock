{% set version = "3.4.0" %}

package:
  name: nvtop
  version: {{ version }}

source:
  url: https://github.com/Syllo/nvtop/archive/refs/tags/{{ version }}.tar.gz
  sha256: 7979f425dc2b748ff191e3999a0994af6154795e0e8640fae1e177684a296e08

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - ncurses
    - libdrm  # [linux]
    - libsystemd  # [linux]

test:
  commands:
    - test -f $PREFIX/bin/nvtop
    - nvtop --help

about:
  home: https://github.com/Syllo/nvtop
  summary: Neat Videocard TOP
  description: |
    A (h)top like task monitor for GPUs and accelerators. It can handle
    multiple GPUs and print information about them in a htop-familiar way.
  license: GPL-3.0-only
  license_family: GPL
  license_file: COPYING

extra:
  recipe-maintainers:
    - hmaarrfk
    - matthiasdiener
